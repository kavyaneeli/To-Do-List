<!DOCTYPE html>
<html>
    <head>
        <title>Digital Clock</title>
        <style>
            body{
                margin: 0;
                padding:0;
                background:  #0a192f;
                color: white;
                font-family: Arial, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height:100vh;
            }
            .container {
                text-align: center;
            }
            h1{
                font-size: 2.5rem;
                margin-bottom: 20px;
            }
            #time{
                font-size: 1.5rem;
                margin: 10px 0 30px 0;
            }

            button{
                padding: 10px 20px;
                font-size: 1rem;
                border: none ;
                border-radius: 5px;
                cursor: pointer;
                background: #64ffda;
                color:#0a192f;
                font-weight: bold;
            }

            button:hover {
                background: #52e0c4;
            }
        </style>
    </head>
    <div class="container">
        <h1>Digital clock</h1>
        <h2 id="time">00:00:00</h2>
        <h2 id="date">03/06/2026</h2>
        <button id="toggle-btn">Switch to 24-hours format</button>
    </div>
    <script src="script1.js"></script>
</html>
