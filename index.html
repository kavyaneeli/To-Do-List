<!DOCTYPE html>
<html>
    <head>
        <title>To-Do List</title>
        <style>
            body{
                font-family: Arial, sans-serif;
                text-align: center;
                margin-top: 50px;
            }
            input{
                padding:10px;
                width:250px;
            }
            button{
                padding: 10px;
                cursor:pointer;
            }
            ul{
                list-style: none;
                padding:0;
            }
            li{
                margin:10px;
            }
            .completed{
                text-decoration: line-through;
                color:grey;
            }
            .delete-btn{
                margin-left: 10px;
            }
        </style>
    </head>
    <body>
        <h1>To-Do List</h1>
        <input type="text" id="taskInput"
        placeholder="Enter Task">
<button id="addBtn">Add Task</button>
<h3>Total Task: <span id="totalCount"></span></h3>
<h3>completed Task:<span id="completedCount">0</span></h3>
<ul id="taskList"></ul>
<script src="script.js"></script>
    </body>
</html>
